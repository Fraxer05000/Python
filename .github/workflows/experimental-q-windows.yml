name: Experimental Q Windows RC19 one-click build

on:
  push:
    branches:
      - experimental-q-build

permissions:
  contents: read
  statuses: write

concurrency:
  group: experimental-q-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Publish auditable run identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $Body = @{
            state = "pending"
            target_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            description = "Experimental Q Windows build is running"
            context = "experimental-q/windows"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $Headers -ContentType "application/json" `
            -Uri "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -Body $Body | Out-Null

      - name: Check out the reviewed source capsule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Extract Experimental Q source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "ExperimentalQ-0.3.0-source-rc17.zip" -DestinationPath $env:GITHUB_WORKSPACE -Force
          if (-not (Test-Path -LiteralPath "experimental-q\scripts\build_windows.ps1" -PathType Leaf)) {
            throw "Reviewed Experimental Q source was not extracted."
          }



      - name: Apply reviewed RC19 acceptance corrections
        shell: pwsh
        run: |
          function Replace-Required {
            param(
              [Parameter(Mandatory)][string]$Text,
              [Parameter(Mandatory)][string]$Old,
              [Parameter(Mandatory)][string]$New,
              [Parameter(Mandatory)][string]$Label
            )
            if (-not $Text.Contains($Old)) {
              throw "RC19 patch anchor was not found: $Label"
            }
            return $Text.Replace($Old, $New)
          }
          
          $ScriptPath = "experimental-q\scripts\smoke_test_windows_installers.ps1"
          $Script = Get-Content -LiteralPath $ScriptPath -Raw -Encoding UTF8
          $Script = [Regex]::Replace($Script, '\r\n', [string][char]10)
          
          $Old = @'
              [Parameter(Mandatory)][string]$ApplicationPath,
              [int]$TimeoutSeconds = 120
          '@
          $New = @'
              [Parameter(Mandatory)][string]$ApplicationPath,
              [Parameter(Mandatory)][string]$InstallRoot,
              [int]$TimeoutSeconds = 120
          '@
          $Script = Replace-Required $Script $Old $New "installer-removal parameters"
          
          $Old = @'
              $ApplicationPresent = Test-Path -LiteralPath $ApplicationPath -PathType Leaf
              if ($Entries.Count -eq 0 -and -not $ApplicationPresent) {
          '@
          $New = @'
              $ApplicationPresent = Test-Path -LiteralPath $ApplicationPath -PathType Leaf
              $InstallRootPresent = Test-Path -LiteralPath $InstallRoot -PathType Container
              if ($Entries.Count -eq 0 -and -not $ApplicationPresent -and -not $InstallRootPresent) {
          '@
          $Script = Replace-Required $Script $Old $New "installer-removal state"
          
          $Old = '  throw "Experimental Q uninstall did not complete within $TimeoutSeconds seconds; executable_present=$ApplicationPresent; remaining_registrations=$RegistrationJson"'
          $New = '  throw "Experimental Q uninstall did not complete within $TimeoutSeconds seconds; executable_present=$ApplicationPresent; install_root_present=$InstallRootPresent; remaining_registrations=$RegistrationJson"'
          $Script = Replace-Required $Script $Old $New "installer-removal error"
          
          $Old = '  param([Parameter(Mandatory)][IO.FileInfo]$Application)'
          $New = @'
            param(
              [Parameter(Mandatory)][IO.FileInfo]$Application,
              [int]$BackendStartupTimeoutSeconds = 120
            )
          '@
          $Script = Replace-Required $Script $Old $New "backend startup parameters"
          
          $Old = @'
              Start-Sleep -Seconds 15
              if ($Process.HasExited) {
                throw "Installed desktop exited during its launch smoke test with $($Process.ExitCode)."
              }
              if (-not (Get-Process -Name "q-backend" -ErrorAction SilentlyContinue)) {
                throw "Installed desktop did not start its packaged backend sidecar."
              }
              if (Get-Process -Name "llama-server" -ErrorAction SilentlyContinue) {
                throw "Installed desktop auto-started Q; launch must remain OFF."
              }
          '@
          $New = @'
              $BackendDeadline = [DateTime]::UtcNow.AddSeconds($BackendStartupTimeoutSeconds)
              $BackendProcesses = @()
              do {
                if ($Process.HasExited) {
                  throw "Installed desktop exited during its launch smoke test with $($Process.ExitCode)."
                }
                if (Get-Process -Name "llama-server" -ErrorAction SilentlyContinue) {
                  throw "Installed desktop auto-started Q; launch must remain OFF."
                }
                $BackendProcesses = @(Get-Process -Name "q-backend" -ErrorAction SilentlyContinue)
                if ($BackendProcesses.Count -gt 0) {
                  break
                }
                Start-Sleep -Seconds 1
              } while ([DateTime]::UtcNow -lt $BackendDeadline)
              if ($BackendProcesses.Count -eq 0) {
                $WorkspaceFiles = @(Get-ChildItem -LiteralPath $Workspace -Recurse -File -ErrorAction SilentlyContinue |
                  Select-Object -First 30 -ExpandProperty FullName)
                throw "Installed desktop did not start its packaged backend sidecar within $BackendStartupTimeoutSeconds seconds; desktop_pid=$($Process.Id); workspace_files=$($WorkspaceFiles -join ', ')."
              }
              Start-Sleep -Seconds 5
              $StableBackendProcesses = @(Get-Process -Name "q-backend" -ErrorAction SilentlyContinue)
              if ($StableBackendProcesses.Count -eq 0) {
                throw "Installed packaged backend sidecar exited before the five-second stability check."
              }
              if (Get-Process -Name "llama-server" -ErrorAction SilentlyContinue) {
                throw "Installed desktop auto-started Q; launch must remain OFF."
              }
          '@
          $Script = Replace-Required $Script $Old $New "bounded backend startup"
          
          $Old = @'
          # Tauri's NSIS template only enables SetAutoClose for passive (/P) and update
          # uninstalls. Silent (/S) suppresses the UI but leaves its hidden InstFiles
          # page open indefinitely. _?= keeps this process in the foreground so the
          # smoke test observes the real exit code and post-uninstall state.
          Invoke-ProcessWithTimeout $Uninstaller.FullName @("/P", "_?=$NsisRoot") 900
          Wait-InstallerRemoval $NsisApplication.FullName
          '@
          $New = @'
          # Tauri's NSIS template only enables SetAutoClose for passive (/P) and update
          # uninstalls. NSIS normally copies the uninstaller to a temporary directory so
          # it can remove the original and $INSTDIR. Reproduce that documented flow while
          # using _?= to wait for the real exit code instead of the short-lived launcher.
          $UninstallerRunner = Join-Path $SmokeRoot "nsis-uninstaller-runner.exe"
          Copy-Item -LiteralPath $Uninstaller.FullName -Destination $UninstallerRunner -Force
          try {
            Invoke-ProcessWithTimeout $UninstallerRunner @("/P", "_?=$NsisRoot") 900
          }
          finally {
            Remove-Item -LiteralPath $UninstallerRunner -Force -ErrorAction SilentlyContinue
          }
          Wait-InstallerRemoval $NsisApplication.FullName $NsisRoot
          '@
          $Script = Replace-Required $Script $Old $New "canonical NSIS uninstall"
          
          $Script = Replace-Required $Script 'Wait-InstallerRemoval $MsiApplication.FullName' 'Wait-InstallerRemoval $MsiApplication.FullName $EffectiveMsiRoot' "MSI root removal"
          $Script = Replace-Required $Script '  nsis = [ordered]@{ install = "ok"; uac_scope = "per_machine"; launch_q_state = "OFF"; uninstall = "ok" }' '  nsis = [ordered]@{ install = "ok"; uac_scope = "per_machine"; launch_q_state = "OFF"; uninstall = "ok"; install_root_removed = $true }' "NSIS evidence"
          $Script = Replace-Required $Script '  msi = [ordered]@{ install = "ok"; uac_scope = "per_machine"; layout = "ok"; launch_q_state = "OFF"; uninstall = "ok" }' '  msi = [ordered]@{ install = "ok"; uac_scope = "per_machine"; layout = "ok"; launch_q_state = "OFF"; uninstall = "ok"; install_root_removed = $true }' "MSI evidence"
          Set-Content -LiteralPath $ScriptPath -Value $Script -Encoding UTF8 -NoNewline
          
          $TestPath = "experimental-q\tests\packaging\test_windows_layout.py"
          $Test = Get-Content -LiteralPath $TestPath -Raw -Encoding UTF8
          $Test = [Regex]::Replace($Test, '\r\n', [string][char]10)
          $Old = '    assert "Test-ApplicationStartsOff $MsiApplication" in script'
          $New = @'
              assert "Test-ApplicationStartsOff $MsiApplication" in script
              assert "$BackendStartupTimeoutSeconds = 120" in script
              assert "$BackendDeadline = [DateTime]::UtcNow.AddSeconds" in script
              assert "five-second stability check" in script
          '@
          $Test = Replace-Required $Test $Old $New "backend startup tests"
          
          $Old = @'
              assert "Wait-InstallerRemoval $NsisApplication.FullName" in script
              assert "Wait-InstallerRemoval $MsiApplication.FullName" in script
              assert '@("/P", "_?=$NsisRoot") 900' in script
          '@
          $New = @'
              assert "Wait-InstallerRemoval $NsisApplication.FullName $NsisRoot" in script
              assert "Wait-InstallerRemoval $MsiApplication.FullName $EffectiveMsiRoot" in script
              assert 'Copy-Item -LiteralPath $Uninstaller.FullName' in script
              assert '$UninstallerRunner @("/P", "_?=$NsisRoot") 900' in script
          '@
          $Test = Replace-Required $Test $Old $New "canonical uninstall tests"
          
          $Old = '    assert "uninstall did not complete within $TimeoutSeconds seconds" in script'
          $New = @'
              assert "uninstall did not complete within $TimeoutSeconds seconds" in script
              assert "install_root_present=$InstallRootPresent" in script
              assert "install_root_removed = $true" in script
          '@
          $Test = Replace-Required $Test $Old $New "root-removal tests"
          Set-Content -LiteralPath $TestPath -Value $Test -Encoding UTF8 -NoNewline
          
          if ((Get-Content -LiteralPath $ScriptPath -Raw) -notmatch 'BackendStartupTimeoutSeconds = 120') {
            throw "RC19 bounded backend startup patch was not applied."
          }
          if ((Get-Content -LiteralPath $ScriptPath -Raw) -notmatch 'nsis-uninstaller-runner.exe') {
            throw "RC19 canonical NSIS uninstall patch was not applied."
          }

      - name: Create reviewed RC19 source capsule
        shell: pwsh
        run: Compress-Archive -Path "experimental-q" -DestinationPath "ExperimentalQ-0.3.0-source-rc19.zip" -CompressionLevel Optimal

      - name: Upload reviewed RC19 source capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-source-rc19
          path: ExperimentalQ-0.3.0-source-rc19.zip
          if-no-files-found: error
          retention-days: 14

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: experimental-q/pyproject.toml

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.15.0
          package_json_file: experimental-q/package.json

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: experimental-q/pnpm-lock.yaml

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Validate Python contracts and RC19 acceptance gates
        shell: pwsh
        working-directory: experimental-q
        run: |
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy apps/backend runtimes tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_packaging.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate the Windows supervisor before the long native build
        shell: pwsh
        working-directory: experimental-q
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build pinned x64 runtimes and fetch verified local models
        shell: pwsh
        working-directory: experimental-q
        run: |
          ./scripts/prepare_windows_dependencies.ps1
          $Lock = Get-Content -LiteralPath "installer/runtime-sources.lock.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          "Q_LLAMA_RUNTIME_DIR=${{ github.workspace }}\experimental-q\vendor\llama" >> $env:GITHUB_ENV
          "Q_LLAMA_RUNTIME_MANIFEST=${{ github.workspace }}\experimental-q\vendor\llama-manifest.json" >> $env:GITHUB_ENV
          "Q_WHISPER_RUNTIME_DIR=${{ github.workspace }}\experimental-q\vendor\whisper" >> $env:GITHUB_ENV
          "Q_WHISPER_RUNTIME_MANIFEST=${{ github.workspace }}\experimental-q\vendor\whisper-manifest.json" >> $env:GITHUB_ENV
          "Q_WHISPER_MODEL_PATH=${{ github.workspace }}\experimental-q\vendor\$($Lock.models.whisper.installed_name)" >> $env:GITHUB_ENV
          "Q_WHISPER_MODEL_SHA256=$($Lock.models.whisper.sha256)" >> $env:GITHUB_ENV
          "Q_MODEL_PATH=${{ github.workspace }}\experimental-q\vendor\$($Lock.models.q.installed_name)" >> $env:GITHUB_ENV
          "Q_MODEL_SHA256=$($Lock.models.q.sha256)" >> $env:GITHUB_ENV

      - name: Import optional release signing certificate
        id: signing
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            "thumbprint=" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $PfxPath = Join-Path $env:RUNNER_TEMP "experimental-q-signing.pfx"
          [IO.File]::WriteAllBytes($PfxPath, [Convert]::FromBase64String($env:PFX_BASE64))
          try {
            $Password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $Certificate = Import-PfxCertificate -FilePath $PfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $Password
            "thumbprint=$($Certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $PfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build and verify NSIS and MSI packages
        shell: pwsh
        working-directory: experimental-q
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            ./scripts/build_windows.ps1
          }
          else {
            ./scripts/build_windows.ps1 -RequireSigning
          }

      - name: Preserve RC19 NSIS candidate before acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-NSIS-candidate-rc19
          path: experimental-q/release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve RC19 MSI candidate before acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-MSI-candidate-rc19
          path: experimental-q/release/*.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve RC19 build evidence before acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-evidence-candidate-rc19
          path: |
            experimental-q/release/release-manifest.json
            experimental-q/vendor/dependency-provenance.json
            experimental-q/vendor/runtime-sources.lock.json
            experimental-q/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Install, launch-off, and uninstall both packages
        shell: pwsh
        working-directory: experimental-q
        run: ./scripts/smoke_test_windows_installers.ps1



      - name: Upload one-click NSIS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-NSIS-accepted
          path: experimental-q/release/*.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload MSI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-MSI-accepted
          path: experimental-q/release/*.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release manifests and Windows evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-evidence-accepted
          path: |
            experimental-q/release/release-manifest.json
            experimental-q/release/windows-smoke-report.json
            experimental-q/vendor/dependency-provenance.json
            experimental-q/vendor/runtime-sources.lock.json
            experimental-q/Cargo.lock
          if-no-files-found: error
          retention-days: 14



      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ExperimentalQ-0.3.0-Windows-failure-diagnostics
          path: |
            experimental-q/build/native-runtime-smoke/*.log
            ${{ runner.temp }}/experimental-q-installer-smoke/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish final build status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $State = if ("${{ job.status }}" -eq "success") { "success" } else { "failure" }
          $Description = if ($State -eq "success") {
            "Experimental Q Windows installers passed"
          } else {
            "Experimental Q Windows build failed"
          }
          $Headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $Body = @{
            state = $State
            target_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            description = $Description
            context = "experimental-q/windows"
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Headers $Headers -ContentType "application/json" `
            -Uri "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -Body $Body | Out-Null
